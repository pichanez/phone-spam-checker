[tool.poetry]
name = "phone-spam-checker"
version = "0.1.0"
description = "Service and CLI utilities for checking phone numbers"
authors = ["Unknown <unknown@example.com>"]
packages = [{include = "phone_spam_checker"}]

[tool.poetry.dependencies]
python = "^3.11"
adbutils = "2.8.7"
annotated-types = "0.7.0"
anyio = "4.9.0"
certifi = "2025.4.26"
charset-normalizer = "3.4.2"
click = "8.1.8"
decorator = "5.2.1"
deprecation = "2.1.0"
fastapi = "0.115.12"
h11 = "0.16.0"
idna = "3.10"
lxml = "5.4.0"
packaging = "25.0"
pillow = "11.2.1"
py = "1.11.0"
pydantic = "2.11.4"
pydantic-settings = "2.2.1"
pydantic_core = "2.33.2"
requests = "2.32.3"
retry = "0.9.2"
sniffio = "1.3.1"
starlette = "0.46.2"
typing-inspection = "0.4.0"
typing_extensions = "4.13.2"
uiautomator2 = "3.2.9"
urllib3 = "2.4.0"
uvicorn = "0.34.2"
httpx = "0.27.0"
PyJWT = "2.8.0"
SQLAlchemy = "2.0.41"
psycopg2-binary = "2.9.10"
redis = "5.0.4"

[tool.poetry.group.dev.dependencies]
black = "23.12.1"
ruff = "0.2.2"
mypy = "1.9.0"
pytest = "8.2.0"
pytest-asyncio = "0.23.5"
pytest-cov = "4.1.0"
pip-audit = "2.7.1"
pre-commit = "^4.2.0"
sqlalchemy2-stubs = "0.0.2a38"
types-redis = "4.6.0.20241004"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
plugins = ["pydantic.mypy"]
show_error_codes = true

